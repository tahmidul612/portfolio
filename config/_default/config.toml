# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://jpanther.github.io/congo/docs/getting-started/

theme = ["hugo-embed-pdf-shortcode", "congo"]
enableInlineShortcodes = true
# Keep the LaTeX source and build leftovers in content/resume/ off the site; only the PDF is published.
ignoreFiles = ['\.tex$', '\.log$', '\.aux$', '\.fdb_latexmk$', '\.fls$', '\.out$', '\.synctex\.gz$']
baseURL = "https://tahmidul612.com/"
defaultContentLanguage = "en"

enableRobotsTXT = true
[pagination]
  disableAliases = false
  pagerSize = 10
  path = 'page'
summaryLength = 0

[outputs]
  home = ["HTML", "RSS", "JSON"]
